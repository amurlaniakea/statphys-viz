[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "statphys-viz"
version = "0.2.2"
description = "Interactive statistical physics visualizations for education: Ising model Monte Carlo with Jupyter widgets and web demo"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Pedro Sordo Martínez", email = "amurlaniakea@gmail.com"},
]
maintainers = [
    {name = "Pedro Sordo Martínez", email = "amurlaniakea@gmail.com"},
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Education",
]
dependencies = [
    "numpy>=1.24",
    "numba>=0.57",
    "matplotlib>=3.7",
    "ipywidgets>=8.0",
    "ipycanvas>=0.11",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "bandit>=1.7",
    "hypothesis>=6.90",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1",
    "nbsphinx>=0.9",
]
[project.urls]
Homepage = "https://github.com/amurlaniakea/statphys-viz"
Repository = "https://github.com/amurlaniakea/statphys-viz"
Issues = "https://github.com/amurlaniakea/statphys-viz/issues"
Documentation = "https://amurlaniakea.github.io/statphys-viz/docs/"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "visual: marks tests that generate visual output",
]

[tool.coverage.run]
source = ["src/statphys_viz"]
omit = ["src/statphys_viz/widgets.py"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".venv", "dist", "build", "*.egg-info", "__pycache__", ".git", "gallery_*.png", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20", "PTH"]
ignore = ["S101", "B018"]

[tool.ruff.lint.per-file-ignores]
"src/statphys_viz/benchmark.py" = ["T201"]
"src/statphys_viz/visualize.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.bandit]
exclude_dirs = ["tests", ".venv", "dist", "build"]
skips = ["B101", "B601"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["statphys_viz*"]
