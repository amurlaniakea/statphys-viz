<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>statphys-viz · Modelo de Ising 2D</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#666}
@media(prefers-color-scheme:dark){:root{--bg:#14161a;--fg:#e8e8e8;--mut:#9aa}}
body{margin:0;padding:1rem;font:16px system-ui,sans-serif;background:var(--bg);color:var(--fg);max-width:720px;margin:auto}
canvas{width:100%;max-width:512px;image-rendering:pixelated;border:1px solid var(--mut);display:block}
label{display:block;margin:.6rem 0 .2rem}input[type=range]{width:100%;max-width:512px}
button,select{font:inherit;padding:.3rem .7rem;margin-right:.4rem}
#obs{color:var(--mut);font-variant-numeric:tabular-nums}
</style></head><body>
<h1>Modelo de Ising 2D</h1>
<p>Monte Carlo en tu navegador (JS puro, sin instalación). T<sub>c</sub> ≈ 2.269.</p>
<canvas id="c" width="64" height="64"></canvas>
<label>Temperatura T = <b id="tv">2.269</b></label>
<input id="T" type="range" min="1" max="4" step="0.01" value="2.269">
<label>Algoritmo</label>
<select id="alg"><option value="wolff">Wolff (cluster)</option><option value="metro">Metropolis</option></select>
<button id="run">Pausa</button><button id="rst">Reiniciar</button>
<p id="obs"></p>
<script>
"use strict";
const L=64,N=L*L;let s=new Int8Array(N),T=2.269,run=true;
const cv=document.getElementById("c"),ctx=cv.getContext("2d"),img=ctx.createImageData(L,L);
function reset(){for(let i=0;i<N;i++)s[i]=Math.random()<.5?1:-1}
function nb(i){const x=i%L,y=(i/L)|0;return[y*L+(x+1)%L,y*L+(x+L-1)%L,((y+1)%L)*L+x,((y+L-1)%L)*L+x]}
const NB=Array.from({length:N},(_,i)=>nb(i));
function metro(){for(let k=0;k<N;k++){const i=(Math.random()*N)|0;let h=0;for(const j of NB[i])h+=s[j];
 const dE=2*s[i]*h;if(dE<=0||Math.random()<Math.exp(-dE/T))s[i]=-s[i]}}
function wolff(){const p=1-Math.exp(-2/T),seed=(Math.random()*N)|0,v=s[seed],st=[seed],inC=new Uint8Array(N);inC[seed]=1;
 while(st.length){const i=st.pop();for(const j of NB[i])if(!inC[j]&&s[j]===v&&Math.random()<p){inC[j]=1;st.push(j)}}
 for(let i=0;i<N;i++)if(inC[i])s[i]=-s[i]}
function obs(){let m=0,e=0;for(let i=0;i<N;i++){m+=s[i];e-=s[i]*(s[NB[i][0]]+s[NB[i][2]])}
 return[e/N,Math.abs(m)/N]}
function draw(){for(let i=0;i<N;i++){const c=s[i]>0?[230,90,40]:[40,90,200];img.data.set([...c,255],4*i)}
 ctx.putImageData(img,0,0);const[e,m]=obs();document.getElementById("obs").textContent=`e/espín = ${e.toFixed(3)}   |m| = ${m.toFixed(3)}`}
function frame(){if(run){const w=document.getElementById("alg").value==="wolff";if(w)for(let k=0;k<5;k++)wolff();else metro();draw()}requestAnimationFrame(frame)}
document.getElementById("T").oninput=e=>{T=+e.target.value;document.getElementById("tv").textContent=T.toFixed(3)};
document.getElementById("run").onclick=e=>{run=!run;e.target.textContent=run?"Pausa":"Continuar"};
document.getElementById("rst").onclick=()=>{reset();draw()};
reset();draw();frame();
</script></body></html>
